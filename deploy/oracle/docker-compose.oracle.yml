services:
  postgres:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-quantsaas}
      POSTGRES_USER: ${POSTGRES_USER:-quantsaas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-quantsaas} -d ${POSTGRES_DB:-quantsaas}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  saas:
    build:
      context: ../..
      dockerfile: saas.Dockerfile
    restart: unless-stopped
    environment:
      APP_ROLE: ${APP_ROLE:-lab}
      DATABASE_DSN: host=postgres user=${POSTGRES_USER:-quantsaas} password=${POSTGRES_PASSWORD} dbname=${POSTGRES_DB:-quantsaas} port=5432 sslmode=disable TimeZone=Asia/Taipei
      REDIS_ADDR: redis:6379
      REDIS_DB: ${REDIS_DB:-0}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      SERVER_ADDR: ${SERVER_ADDR:-:8080}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  postgres-data:


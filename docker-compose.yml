services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: quantsaas
      POSTGRES_USER: quantsaas
      POSTGRES_PASSWORD: quantsaas
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quantsaas -d quantsaas"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  saas:
    build:
      context: .
      dockerfile: saas.Dockerfile
    environment:
      APP_ROLE: ${APP_ROLE:-dev}
      DATABASE_DSN: host=postgres user=quantsaas password=quantsaas dbname=quantsaas port=5432 sslmode=disable TimeZone=Asia/Taipei
      REDIS_ADDR: redis:6379
      REDIS_DB: "0"
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me}
      SERVER_ADDR: :8080
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"

volumes:
  postgres-data:

services:
  postgres:
    image: postgres:15
    mem_limit: ${POSTGRES_MEMORY_LIMIT:-3g}
    environment:
      POSTGRES_DB: quantsaas
      POSTGRES_USER: quantsaas
      POSTGRES_PASSWORD: quantsaas
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quantsaas -d quantsaas"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    mem_limit: ${REDIS_MEMORY_LIMIT:-512m}
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  saas:
    build:
      context: .
      dockerfile: saas.Dockerfile
    environment:
      APP_ROLE: ${APP_ROLE:-dev}
      DATABASE_DSN: host=postgres user=quantsaas password=quantsaas dbname=quantsaas port=5432 sslmode=disable TimeZone=Asia/Taipei
      REDIS_ADDR: redis:6379
      REDIS_DB: "0"
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me}
      SERVER_ADDR: :8080
      FRED_API_KEY: ${FRED_API_KEY:-}
      GOMEMLIMIT: ${GOMEMLIMIT:-3GiB}
    mem_limit: ${SAAS_MEMORY_LIMIT:-4g}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"
    logging:
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres-data:
